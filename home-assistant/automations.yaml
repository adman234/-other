- id: '1765400718518'
  alias: Attic Fan Relay Control
  description: ''
  triggers:
  - trigger: time_pattern
    minutes: /15
    id: timer
  - trigger: state
    entity_id:
    - climate.thermy_mcthermostat
    attribute: hvac_action
    to:
    - heating
    - cooling
    - preheating
    - defrosting
    id: stop
  - type: turned_on
    device_id: 25c6ddbdc70f57bf94b044aa4968737f
    entity_id: f3bf2a4d57f276a56d64619810554f39
    domain: switch
    trigger: device
    for:
      hours: 0
      minutes: 55
      seconds: 0
    id: stop2
  - trigger: event.received
    target:
      entity_id: event.attic_fan_switch_action
    options:
      event_type:
      - input_1_toggle
    id: toggle
  conditions: []
  actions:
  - alias: if - timer
    if:
    - condition: trigger
      id:
      - timer
    - condition: numeric_state
      entity_id: weather.home
      attribute: dew_point
      below: 75
    - alias: Temp above 60
      condition: temperature.is_value
      target:
        entity_id: weather.home
      options:
        threshold:
          type: above
          value:
            active_choice: number
            unit_of_measurement: °F
            number: 60
    - condition: device
      device_id: 56eb2d71893ba4b27babca7e5177487e
      domain: climate
      entity_id: ad024e131b974e1309dd1d35cfe04d72
      type: is_preset_mode
      preset_mode: sleep
    - condition: state
      entity_id: climate.thermy_mcthermostat
      state:
      - fan
      - idle
      - 'off'
      - defrosting
      attribute: hvac_action
    - type: is_temperature
      condition: device
      device_id: 86edfb7209c6a28d57a5683c58e81284
      entity_id: 1734c9f2b1ca8885edae4a82f36547d4
      domain: sensor
      above: 75
    - condition: numeric_state
      entity_id: weather.home
      attribute: temperature
      below: sensor.thermy_mcthermostat_current_temperature
      value_template: '{{ state.attributes.temperature | float(999) + 1 }}'
    then:
    - alias: Turn on attic fan if window is open
      if:
      - type: is_open
        condition: device
        device_id: 8cc291dbb1e0d4d002fbb5326f5b24ca
        entity_id: 92f0b11736dd45b4efddfe5b2e689e95
        domain: binary_sensor
        for:
          hours: 0
          minutes: 0
          seconds: 5
      then:
      - type: turn_on
        device_id: 25c6ddbdc70f57bf94b044aa4968737f
        entity_id: f3bf2a4d57f276a56d64619810554f39
        domain: switch
        enabled: true
      - action: notify.persistent_notification
        metadata: {}
        data:
          message: Attic Fan turned ON by trigger
      else:
      - action: notify.persistent_notification
        metadata: {}
        data:
          message: Attic Fan failed to turn ON - window closed
  - if:
    - condition: trigger
      id:
      - stop2
    then:
    - if:
      - condition: device
        type: is_on
        device_id: 25c6ddbdc70f57bf94b044aa4968737f
        entity_id: f3bf2a4d57f276a56d64619810554f39
        domain: switch
      then:
      - action: notify.persistent_notification
        metadata: {}
        data:
          message: Attic Fan Turned OFF - TIMEOUT
        enabled: true
    - type: turn_off
      device_id: 25c6ddbdc70f57bf94b044aa4968737f
      entity_id: f3bf2a4d57f276a56d64619810554f39
      domain: switch
    alias: if stop - 55min
  - if:
    - condition: trigger
      id:
      - stop
    then:
    - if:
      - condition: device
        type: is_on
        device_id: 25c6ddbdc70f57bf94b044aa4968737f
        entity_id: f3bf2a4d57f276a56d64619810554f39
        domain: switch
      then:
      - action: notify.persistent_notification
        metadata: {}
        data:
          message: Attic Fan Turned OFF by heater/AC mode
        enabled: true
    - type: turn_off
      device_id: 25c6ddbdc70f57bf94b044aa4968737f
      entity_id: f3bf2a4d57f276a56d64619810554f39
      domain: switch
    alias: if stop - heater/AC
  - choose:
    - conditions:
      - condition: trigger
        id:
        - toggle
      - condition: device
        type: is_on
        device_id: 25c6ddbdc70f57bf94b044aa4968737f
        entity_id: f3bf2a4d57f276a56d64619810554f39
        domain: switch
        for:
          hours: 0
          minutes: 0
          seconds: 1
      sequence:
      - type: turn_off
        device_id: 25c6ddbdc70f57bf94b044aa4968737f
        entity_id: f3bf2a4d57f276a56d64619810554f39
        domain: switch
      - action: notify.persistent_notification
        metadata: {}
        data:
          message: Attic Fan Turned OFF by switch
        enabled: true
    - conditions:
      - condition: trigger
        id:
        - toggle
      - condition: device
        type: is_off
        device_id: 25c6ddbdc70f57bf94b044aa4968737f
        entity_id: f3bf2a4d57f276a56d64619810554f39
        domain: switch
        for:
          hours: 0
          minutes: 0
          seconds: 1
      sequence:
      - alias: Turn on attic fan as long as AC/heater is not running
        if:
        - condition: state
          entity_id: climate.thermy_mcthermostat
          state:
          - fan
          - idle
          - 'off'
          - drying
          - defrosting
          attribute: hvac_action
          enabled: true
        then:
        - type: turn_on
          device_id: 25c6ddbdc70f57bf94b044aa4968737f
          entity_id: f3bf2a4d57f276a56d64619810554f39
          domain: switch
          enabled: true
        - action: notify.persistent_notification
          metadata: {}
          data:
            message: Attic Fan Turned ON by switch
          enabled: true
        else:
        - type: turn_on
          device_id: 25c6ddbdc70f57bf94b044aa4968737f
          entity_id: f3bf2a4d57f276a56d64619810554f39
          domain: switch
          enabled: true
        - action: notify.persistent_notification
          metadata: {}
          data:
            message: ATTIC FAN TURNED ON - OVERRIDE - AC RUNNING
