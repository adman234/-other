- id: '1791207700857'
  alias: Everyone Away - Shut Things Off
  description: '10 min after both of us leave: turn off what was left on, post a summary
    in Home Assistant, and alert Adam''s phone if a door is unlocked or the garage
    is open.'
  triggers:
  - trigger: numeric_state
    entity_id: zone.home
    below: 1
    for:
      minutes: 10
  conditions: []
  actions:
  - alias: Remember what is on right now (used by the summary)
    variables:
      on_before: "{{ ['fan.bedroom_fan', 'light.bedroom_fan', 'switch.lava_lamp_switch_z',\n
        \   'switch.wax_melter_plug_z', 'light.bedroom_dimmer',\n    'light.bedroom_wled_main',
        'climate.bedjet_bridge_bedjet',\n    'light.living_room_switch_z', 'light.foyer_dimmer_z',\n
        \   'light.dining_room_dimmer', 'light.kitchen_switch_z',\n    'light.deck_stairs_switch_z',
        'light.basement_stairs_switch_zz',\n    'light.basement_front_lights_z', 'light.project_room_switch_zz',\n
        \   'switch.workshop_lights_switch', 'light.office_presence_dimmer_z']\n   |
        reject('is_state', 'off') | reject('is_state', 'unavailable')\n   | reject('is_state',
        'unknown') | list }}"
  - alias: Turn off bedroom and main floor
    action: homeassistant.turn_off
    target:
      entity_id:
      - fan.bedroom_fan
      - light.bedroom_fan
      - switch.lava_lamp_switch_z
      - switch.wax_melter_plug_z
      - light.bedroom_dimmer
      - light.bedroom_wled_main
      - light.living_room_switch_z
      - light.foyer_dimmer_z
      - light.dining_room_dimmer
      - light.kitchen_switch_z
      - light.deck_stairs_switch_z
    continue_on_error: true
    data: {}
  - alias: Turn off BedJet if it is running
    if:
    - condition: not
      conditions:
      - condition: state
        entity_id: climate.bedjet_bridge_bedjet
        state:
        - 'off'
        - unavailable
        - unknown
    then:
    - action: climate.set_hvac_mode
      target:
        entity_id: climate.bedjet_bridge_bedjet
      data:
        hvac_mode: 'off'
      continue_on_error: true
  - alias: Basement - skip if someone is down there
    if:
    - condition: state
      entity_id: binary_sensor.basement_main_area_presense
      state: 'off'
    then:
    - action: light.turn_off
      target:
        entity_id:
        - light.basement_stairs_switch_zz
        - light.basement_front_lights_z
      continue_on_error: true
      data: {}
  - alias: Project room and workshop - skip if someone is in there
    if:
    - condition: state
      entity_id: binary_sensor.akamatis_presence_sensor_a97710_presence
      state: 'off'
    then:
    - action: switch.turn_off
      target:
        entity_id: switch.workshop_lights_switch
      continue_on_error: true
    - alias: Project room light - leave on while a 3D printer is running
      if:
      - condition: not
        conditions:
        - condition: state
          entity_id: binary_sensor.octoprint_printing
          state: 'on'
        - condition: state
          entity_id: sensor.bambu_a1_print_status
          state:
          - running
          - prepare
          - pause
      then:
      - action: light.turn_off
        target:
          entity_id: light.project_room_switch_zz
        continue_on_error: true
  - alias: Office - skip if someone is in there
    if:
    - condition: state
      entity_id: binary_sensor.office_presence_presence
      state: 'off'
    then:
    - action: light.turn_off
      target:
        entity_id: light.office_presence_dimmer_z
      continue_on_error: true
  - alias: Give devices a moment to report their new state
    delay:
      seconds: 10
  - alias: Post summary in Home Assistant (only if something was on)
    if:
    - condition: template
      value_template: '{{ on_before | count > 0 }}'
    then:
    - action: persistent_notification.create
      data:
        notification_id: away_shutdown
        title: Some Devices were left on
        message: '{% set off_now = on_before | select(''is_state'', ''off'') | list
          -%}

          {% set still_on = on_before | reject(''is_state'', ''off'') | list -%}

          **Turned off**

          {% for e in off_now %}

          - {{ state_attr(e, ''friendly_name'') or e }}

          {%- else %}

          - nothing

          {%- endfor %}


          **Left on**

          {% for e in still_on %}

          - {{ state_attr(e, ''friendly_name'') or e }}

          {%- else %}

          - nothing

          {%- endfor %}

          {% if still_on %}


          Why: {{ ''basement occupied; '' if not is_state(''binary_sensor.basement_main_area_presense'',
          ''off'') else '''' }}{{ ''project room occupied; '' if not is_state(''binary_sensor.akamatis_presence_sensor_a97710_presence'',
          ''off'') else '''' }}{{ ''office occupied; '' if not is_state(''binary_sensor.office_presence_presence'',
          ''off'') else '''' }}{{ ''3D printer running; '' if is_state(''binary_sensor.octoprint_printing'',
          ''on'') or states(''sensor.bambu_a1_print_status'') in [''running'', ''prepare'',
          ''pause''] else '''' }}anything else did not respond.

          {% endif %}'
  - alias: Door / garage alert - repeat every 5 min until fixed, ignored or someone
      is home
    repeat:
      while:
      - condition: numeric_state
        entity_id: zone.home
        below: 1
      - condition: or
        conditions:
        - condition: state
          entity_id: lock.front_door_lock
          state: unlocked
        - condition: state
          entity_id: lock.basement_door_lock
          state: unlocked
        - condition: state
          entity_id: cover.ratgdov2_00f33c_door
          state: open
      sequence:
      - choose:
        - alias: A door is unlocked AND the garage is open
          conditions:
          - condition: or
            conditions:
            - condition: state
              entity_id: lock.front_door_lock
              state: unlocked
            - condition: state
              entity_id: lock.basement_door_lock
              state: unlocked
          - condition: state
            entity_id: cover.ratgdov2_00f33c_door
            state: open
          sequence:
          - action: notify.mobile_app_pixel_9_pro_xl
            data:
              title: Nobody home - doors AND garage
              message: 'Front: {{ states(''lock.front_door_lock'') }}, Basement: {{
                states(''lock.basement_door_lock'') }}, Garage: {{ states(''cover.ratgdov2_00f33c_door'')
                }}'
              data:
                tag: away_doors
                ttl: 0
                priority: high
                actions:
                - action: LOCK_BOTH_DOOR
                  title: Lock Doors
                - action: CLOSE_GARAGE
                  title: Close Garage
                - action: IGNORE_AWAY_ALERT
                  title: Ignore
        - alias: Only the garage is open
          conditions:
          - condition: state
            entity_id: cover.ratgdov2_00f33c_door
            state: open
          sequence:
          - action: notify.mobile_app_pixel_9_pro_xl
            data:
              title: Nobody home - garage is open
              message: The garage door is open.
              data:
                tag: away_doors
                ttl: 0
                priority: high
                actions:
                - action: CLOSE_GARAGE
                  title: Close Garage
                - action: IGNORE_AWAY_ALERT
                  title: Ignore
        default:
        - alias: Only a door is unlocked
          action: notify.mobile_app_pixel_9_pro_xl
          data:
            title: Nobody home - door unlocked
            message: 'Front: {{ states(''lock.front_door_lock'') }}, Basement: {{
              states(''lock.basement_door_lock'') }}'
            data:
              tag: away_doors
              ttl: 0
              priority: high
              actions:
              - action: LOCK_BOTH_DOOR
                title: Lock Doors
              - action: IGNORE_AWAY_ALERT
                title: Ignore
      - alias: Wait 5 min, or until Ignore is pressed or someone gets home
        wait_for_trigger:
        - trigger: event
          event_type: mobile_app_notification_action
          event_data:
            action: IGNORE_AWAY_ALERT
        - trigger: numeric_state
          entity_id: zone.home
          above: 0
        timeout:
          minutes: 5
        continue_on_timeout: true
      - alias: Stop if Ignore was pressed or someone came home
        if:
        - condition: template
          value_template: '{{ wait.trigger is not none }}'
        then:
        - stop: Ignored, or someone is home
  - alias: Remove the phone alert once it no longer applies
    action: notify.mobile_app_pixel_9_pro_xl
    data:
      message: clear_notification
      data:
        tag: away_doors
  mode: single
- id: '1791837129588'
  alias: Jarvis - Stop
  description: ''
  triggers:
  - trigger: conversation
    command:
    - stop
    - never mind
    - nevermind
  actions:
  - set_conversation_response: No worries, mate.
